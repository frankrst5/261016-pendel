<!doctype html>
<html lang="de">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#14171c;--mute:#6b7280;--line:#e3e5e9;--acc:#0a66d6;--late:#d9480f;--bad:#c62828;--ok:#1b8a3a;--trk:#14171c;--trkfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#181b20;--fg:#eef0f3;--mute:#8b93a1;--line:#272b33;--acc:#5aa2ff;--late:#ff8a3d;--bad:#ff5c5c;--ok:#4cc46d;--trk:#eef0f3;--trkfg:#0e1013}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top) + 18px) 12px calc(env(safe-area-inset-bottom) + 16px)}
/* feste, deckende Fläche hinter der Statusleiste: iOS färbt die Leiste damit ein statt Inhalt darunter weichzuzeichnen */
.sbar{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 10px);background:var(--bg);z-index:1000}
.top{display:flex;gap:6px;margin-bottom:8px}
.top>button{padding:6px 9px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
button:active{opacity:.6}
.meta{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;margin:0 2px 8px}
.ml{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio{display:flex;gap:4px;flex:none;margin-left:auto}
.radio button{padding:3px 7px;font-size:12px;font-weight:700;border-radius:7px}
.radio button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.radio button.wait{opacity:.5}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.card.first{border-color:var(--acc)}
.card.minor{padding:6px 12px;opacity:.62}
.card.minor.open{opacity:1}
.card.minor .t,.card.minor .new{font-size:17px}
.card.minor .arr,.card.minor .arr .new{font-size:14px}
.card.minor .trk{font-size:13px;padding:1px 6px;background:var(--mute)}
.card.minor .r2{font-size:12px}
.card.minor .new,.card.minor .in,.card.minor .dev,.card.minor .info,.card.minor .tag,.card.minor ol.stops .late{color:var(--fg)}
.card.minor .dev{font-weight:500}
.card.minor .pos::before,.card.minor ol.stops li.done::before{color:var(--mute);background:var(--mute);border-color:var(--mute)}
.card.minor .pos::before{background:none}
.day{font-size:12px;color:var(--mute);text-align:center;margin:12px 0 6px;font-weight:600}
.tm-mk.minor,.tm-mk.minor.late{background:#8b93a1;font-size:10px;opacity:.85}
.card.cx{opacity:.75}
.card.cx .t{text-decoration:line-through}
.r1{display:flex;align-items:baseline;gap:6px}
.t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.new{font-size:22px;font-weight:700;color:var(--late);font-variant-numeric:tabular-nums}
.old{margin-right:2px;text-decoration:line-through;color:var(--mute);font-weight:500;font-size:16px}
.arr{font-size:16px;font-variant-numeric:tabular-nums}
.arr .new{font-size:16px}
.dur{font-size:12px;color:var(--mute);white-space:nowrap}
.trk{margin-left:auto;align-self:center;background:var(--trk);color:var(--trkfg);border-radius:7px;padding:2px 8px;font-weight:700;font-size:15px;min-width:34px;text-align:center}
.trk small{font-weight:500;font-size:10px;display:block;line-height:1;opacity:.8;white-space:nowrap}
.r2{font-size:13px;color:var(--mute);margin-top:2px}
.r2 b{color:var(--fg);font-weight:600}
.in{color:var(--acc);font-weight:700}
.dev{color:var(--bad);font-size:13px;font-weight:600;margin-top:3px}
.info{color:var(--late);font-size:12.5px;margin-top:3px}
.pos{font-size:12.5px;margin-top:3px;color:var(--fg)}
.pos::before{content:"● ";color:var(--ok)}
.card{cursor:pointer;-webkit-tap-highlight-color:transparent}
ol.stops,.det{display:none}
.card.open ol.stops,.card.open .det{display:block}
.ic{margin-left:5px;font-size:13px}
.tag{margin-left:6px;font-size:11px;font-weight:700;padding:0 5px;border-radius:5px;border:1px solid currentColor;color:var(--acc)}
.tag.short{color:var(--late)}
.det{margin-top:6px;font-size:12.5px}
.det p{margin:4px 0;padding:6px 8px;border-radius:8px;background:var(--bg)}
.det b{display:block}
.wx{margin-left:6px}
ol.stops{list-style:none;margin:8px 0 0;padding:0;font-size:13px;border-left:2px solid var(--line);margin-left:4px}
ol.stops li{display:flex;gap:8px;padding:2px 0 2px 10px;position:relative}
ol.stops li::before{content:"";position:absolute;left:-5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--card);border:2px solid var(--mute)}
ol.stops li.done::before{background:var(--ok);border-color:var(--ok)}
ol.stops li.end{font-weight:700}
ol.stops .n{flex:1}
ol.stops .tm{font-variant-numeric:tabular-nums;white-space:nowrap}
ol.stops s{color:var(--mute)}
ol.stops .late{color:var(--late);font-weight:600}
#map.big{height:56vh}
.tm-mk.mine{background:var(--acc);font-size:12px;padding:2px 7px}
.me-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #0a84ff;margin-right:4px;vertical-align:-1px}
.card.travel{cursor:default}
.comp{margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--bg);font-size:13px}
#map{height:32vh;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--card)}
.tm-mk{background:var(--acc);color:#fff;border:2px solid #fff;border-radius:9px;padding:1px 5px;font:700 11px/1.3 -apple-system,system-ui,sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tm-mk.late{background:var(--late)}
.tm-mk i{font-style:normal;display:inline-block}
.st-mk{width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid #14171c}
.me-mk{width:14px;height:14px;border-radius:50%;background:#0a84ff;border:3px solid #fff;box-shadow:0 0 0 2px rgba(10,132,255,.35)}
.leaflet-container{font:inherit}
.leaflet-tile-container img{width:256.5px!important;height:256.5px!important}   /* keine Kachelfugen auf iOS */
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px}
.msg.err{border-color:var(--bad)}
#settings{display:none}
#settings.open{display:block}
#settings label{display:block;font-size:13px;margin:8px 0 4px}
#settings select,#settings input[type=text]{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chk{display:flex!important;gap:8px;align-items:center}
.seg{display:flex;gap:6px;flex:1}
.seg button{flex:1;padding:6px 4px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
a{color:var(--acc)}

</head>
<body>
<div class="sbar"></div>
<div class="top">
  <button id="btnSettings" aria-label="Einstellungen">⚙︎</button>
  <div class="seg" id="seg">
    <button data-d="auto">📍 Auto</button>
    <button data-d="toSt">→ Sthlm</button>
    <button data-d="toKn">→ Knivsta</button>
  </div>
</div>
<div class="meta"><span class="ml"><span id="loc"></span> <span id="upd"></span></span>
  <span class="radio" id="radio"><button data-ch="p1">P1</button><button data-ch="p2">P2</button><button data-ch="p3">P3</button><button data-ch="p4">P4</button><button data-ch="flux">Flux</button><button data-ch="hb" title="Handelsblatt Morning Briefing">HB</button></span></div>
<div id="settings" class="msg">
  <b>Einstellungen</b>
  <label for="key">Trafikverket API-Schlüssel</label>
  <input id="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="z. B. 0123abcd…">
  <div style="font-size:12px;color:var(--mute);margin-top:4px">Kostenlos unter <a href="https://data.trafikverket.se/" target="_blank" rel="noopener">data.trafikverket.se</a> (Konto anlegen → API-Nyckel). Wird nur auf diesem Gerät gespeichert.</div>
  <label for="ckey">CARTO-Kartenschlüssel (optional)</label>
  <input id="ckey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ohne Schlüssel: OpenStreetMap-Standardkarte">
  <label for="mapstyle">Kartenstil</label>
  <select id="mapstyle"><option value="auto">automatisch (wie iPhone hell/dunkel)</option><option value="light">immer hell</option><option value="dark">immer dunkel</option></select>
  <label class="chk"><input id="city" type="checkbox"> Pendeltåg über Stockholm City einbeziehen</label>
  <div class="row"><button id="btnSave">Speichern</button><span style="font-size:11px;color:var(--mute);align-self:center">Version 21</span></div>
</div>
<div id="map"></div>
<main id="list"></main>

<script>
'use strict';
const API = 'https://api.trafikinfo.trafikverket.se/v2/data.json';
const KNIVSTA = {lat: 59.7258, lon: 17.7866}, STHLM = {lat: 59.3307, lon: 18.0586};
const KNIVSTA_RADIUS_KM = 18;            // Knivsta inkl. Vassunda, Alsike
const FIRST_H = 3, PAGE_H = 6, MAX_H = 36;   // Live-Fenster, Nachladeschritt, Gesamthorizont (Stunden)
const FALLBACK_NAMES = {Cst: 'Stockholm C', Sci: 'Stockholm City', Kn: 'Knivsta', U: 'Uppsala C'};

const $ = s => document.querySelector(s);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ohne Standort: vormittags Richtung Stockholm, ab 12 Uhr Richtung Knivsta
const timeDir = () => new Date().getHours() < 12 ? 'toSt' : 'toKn';
const state = {
  key: ls.get('key', ''),
  ckey: ls.get('ckey', ''),
  mapstyle: ls.get('mapstyle', 'auto'),
  city: ls.get('city', true),
  mode: ls.get('mode', 'auto'),          // auto | toKn | toSt
  autoDir: ls.get('autoDirTs', 0) > Date.now() - 2 * 3600e3 ? ls.get('autoDir', 'toSt') : timeDir(),
  locText: '',
  schema: ls.get('schema', '2.0'),
  names: ls.get('names', null),
  data: null, busy: false, open: new Set()
};

const dir = () => state.mode === 'auto' ? state.autoDir : state.mode;
const sthlmSigs = () => state.city ? ['Cst', 'Sci'] : ['Cst'];
function route(d = dir()) {
  return d === 'toKn' ? {from: sthlmSigs(), to: ['Kn'], title: 'Stockholm → Knivsta'}
                      : {from: ['Kn'], to: sthlmSigs(), title: 'Knivsta → Stockholm'};
}
const name = s => (state.names && state.names[s]) || FALLBACK_NAMES[s] || s;

// ---------- API ----------
function queryXml(objecttype, filter, extra = '') {
  const sch = objecttype === 'TrainStation' ? 'namespace="rail.infrastructure" schemaversion="1.5"'
    : state.schema === '2.0' ? 'namespace="rail.trafficinfo" schemaversion="2.0"' : 'schemaversion="1.9"';
  return `<QUERY objecttype="${objecttype}" ${sch} ${extra}><FILTER>${filter}</FILTER></QUERY>`;
}
async function post(queries) {
  const body = `<REQUEST><LOGIN authenticationkey="${esc(state.key)}"/>${queries.join('')}</REQUEST>`;
  const r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'text/xml'}, body});
  let j = null;
  try { j = await r.json(); } catch {}
  const res = j && j.RESPONSE && j.RESPONSE.RESULT;
  const err = res && res.find(x => x.ERROR);
  if (!r.ok || err || !res) {
    const m = err ? (err.ERROR.MESSAGE || err.ERROR.SOURCE) : `HTTP ${r.status}`;
    const e = new Error(m); e.status = r.status; throw e;
  }
  return res;
}
async function postTA(queries) {
  try { return await post(queries()); }
  catch (e) {
    if (e.status === 401 || /auth/i.test(e.message)) throw e;
    // Fallback auf ältere Schema-Version
    state.schema = state.schema === '2.0' ? '1.9' : '2.0';
    const r = await post(queries());
    ls.set('schema', state.schema);
    return r;
  }
}

const eq = (n, v) => `<EQ name="${n}" value="${v}"/>`;
const anyOf = (n, vs) => vs.length === 1 ? eq(n, vs[0]) : `<OR>${vs.map(v => eq(n, v)).join('')}</OR>`;

async function loadNames() {
  if (state.names && ls.get('namesTs', 0) > Date.now() - 30 * 864e5) return;
  try {
    const res = await post([queryXml('TrainStation', eq('Advertised', 'true'))]);
    const m = {};
    for (const s of res[0].TrainStation || []) m[s.LocationSignature] = s.AdvertisedShortLocationName || s.AdvertisedLocationName;
    state.names = m; ls.set('names', m); ls.set('namesTs', Date.now());
  } catch {}
}

async function loadTrains(d, from, to) {      // ohne from/to: Live-Fenster ab jetzt
  const rt = route(d);
  const iso = ms => new Date(ms).toISOString();
  const [d0, d1, a1] = from ? [iso(from), iso(to), iso(to + 3 * 3600e3)] : ['$dateadd(-00:15:00)', `$dateadd(0${FIRST_H}:00:00)`, `$dateadd(0${FIRST_H + 2}:00:00)`];
  const res = await postTA(() => [
    queryXml('TrainAnnouncement', `<AND>${eq('ActivityType', 'Avgang')}${eq('Advertised', 'true')}${anyOf('LocationSignature', rt.from)}<GT name="AdvertisedTimeAtLocation" value="${d0}"/><LT name="AdvertisedTimeAtLocation" value="${d1}"/></AND>`, 'orderby="AdvertisedTimeAtLocation"'),
    queryXml('TrainAnnouncement', `<AND>${eq('ActivityType', 'Ankomst')}${eq('Advertised', 'true')}${anyOf('LocationSignature', rt.to)}<GT name="AdvertisedTimeAtLocation" value="${d0}"/><LT name="AdvertisedTimeAtLocation" value="${a1}"/></AND>`, 'orderby="AdvertisedTimeAtLocation"')
  ]);
  const deps = res[0].TrainAnnouncement || [], arrs = res[1].TrainAnnouncement || [];
  const now = Date.now();
  const out = [];
  for (const dp of deps) {
    if (dp.TimeAtLocation && new Date(dp.TimeAtLocation) < now - 30e3) continue;      // schon abgefahren
    const tDep = new Date(dp.AdvertisedTimeAtLocation);
    if (!dp.EstimatedTimeAtLocation && !dp.Canceled && tDep < now - 60e3) continue;   // planmäßig vorbei, keine Prognose
    const ar = arrs.find(a => a.AdvertisedTrainIdent === dp.AdvertisedTrainIdent && sameRun(a, dp) &&
      new Date(a.AdvertisedTimeAtLocation) > tDep && new Date(a.AdvertisedTimeAtLocation) - tDep < 3 * 3600e3);
    if (!ar) continue;
    out.push({id: dp.AdvertisedTrainIdent + '|' + dp.AdvertisedTimeAtLocation, dep: dp, arr: ar, stops: null});
  }
  return {dir: d, trains: out, ts: Date.now()};
}
const runDay = a => (a.ScheduledDepartureDateTime || '').slice(0, 10);
const sameRun = (a, b) => !runDay(a) || !runDay(b) || runDay(a) === runDay(b);

async function loadStops(data) {
  if (!data.trains.length) return;
  const parts = data.trains.map(t => {
    const t0 = new Date(t.dep.AdvertisedTimeAtLocation);
    const a = new Date(t0 - 4 * 3600e3).toISOString(), b = new Date(+t0 + 4 * 3600e3).toISOString();
    return `<AND>${eq('AdvertisedTrainIdent', t.dep.AdvertisedTrainIdent)}<GT name="AdvertisedTimeAtLocation" value="${a}"/><LT name="AdvertisedTimeAtLocation" value="${b}"/></AND>`;
  });
  const res = await postTA(() => [queryXml('TrainAnnouncement', `<AND>${eq('Advertised', 'true')}<OR>${parts.join('')}</OR></AND>`, 'orderby="AdvertisedTimeAtLocation"')]);
  const all = res[0].TrainAnnouncement || [];
  for (const t of data.trains) {
    const anns = all.filter(a => a.AdvertisedTrainIdent === t.dep.AdvertisedTrainIdent && sameRun(a, t.dep));
    const bySig = new Map();
    for (const a of anns) {
      let s = bySig.get(a.LocationSignature);
      if (!s) bySig.set(a.LocationSignature, s = {sig: a.LocationSignature});
      s[a.ActivityType === 'Ankomst' ? 'arr' : 'dep'] = a;
    }
    const full = [...bySig.values()].sort((x, y) => new Date((x.arr || x.dep).AdvertisedTimeAtLocation) - new Date((y.arr || y.dep).AdvertisedTimeAtLocation));
    const i0 = full.findIndex(s => s.sig === t.dep.LocationSignature), i1 = full.findIndex(s => s.sig === t.arr.LocationSignature);
    t.stops = i0 >= 0 && i1 > i0 ? full.slice(i0, i1 + 1) : [];
    // letzte gemeldete Position des Zuges
    let last = null;
    for (const s of full) for (const a of [s.arr, s.dep]) if (a && a.TimeAtLocation && (!last || new Date(a.TimeAtLocation) >= new Date(last.TimeAtLocation))) last = a;
    t.last = last;
    t.origin = full[0] && full[0].sig;
    t.route = full.map(s => s.sig);
  }
}

// ---------- Darstellung ----------
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const hm = d => new Date(d).toLocaleTimeString('sv-SE', {hour: '2-digit', minute: '2-digit'});
const txt = v => !v ? [] : (Array.isArray(v) ? v : [v]).map(x => typeof x === 'string' ? x : (x.Description || x.Code || '')).filter(Boolean);
// tatsächliche bzw. erwartete Zeit: Ist > Prognose > langfristig geplante Änderung (z. B. Bauarbeiten)
const realT = a => a.TimeAtLocation || a.EstimatedTimeAtLocation || (a.PlannedEstimatedTimeAtLocationIsValid && a.PlannedEstimatedTimeAtLocation) || null;
const planned = a => !!(a.PlannedEstimatedTimeAtLocationIsValid && a.PlannedEstimatedTimeAtLocation && hm(a.PlannedEstimatedTimeAtLocation) !== hm(a.AdvertisedTimeAtLocation));
const prelim = a => !a.TimeAtLocation && a.EstimatedTimeAtLocation && a.EstimatedTimeIsPreliminary;
const delayMin = a => {
  const r = realT(a);
  return r ? Math.round((new Date(r) - new Date(a.AdvertisedTimeAtLocation)) / 60e3) : 0;
};
function timeHtml(a, cls = 't') {
  const real = realT(a);
  if (real && hm(real) !== hm(a.AdvertisedTimeAtLocation))
    return `<span class="old">${hm(a.AdvertisedTimeAtLocation)}</span><span class="new">${prelim(a) ? '≈' : ''}${hm(real)}</span>`;
  return `<span class="${cls}">${hm(a.AdvertisedTimeAtLocation)}</span>`;
}
function stopTime(a) {
  if (!a) return '';
  const real = realT(a);
  return real && hm(real) !== hm(a.AdvertisedTimeAtLocation)
    ? `<s>${hm(a.AdvertisedTimeAtLocation)}</s> <span class="late">${hm(real)}</span>` : hm(a.AdvertisedTimeAtLocation);
}
function relIn(a) {
  const m = Math.round((new Date(realT(a) || a.AdvertisedTimeAtLocation) - Date.now()) / 60e3);
  return m <= 0 ? 'jetzt' : m < 60 ? `in ${m} min` : m < 180 ? `in ${Math.floor(m / 60)} h ${m % 60} min` : `in ${Math.round(m / 60)} h`;
}

let firstPref = null;
const isSthlm = sig => sig === 'Cst' || sig === 'Sci';
const NOISE = /biljett|stannar ej|resa förbi|långt tåg|kort tåg/i;
const LONG = /långt tåg/i, SHORT = /kort tåg/i;
const trainInfos = anns => anns.filter(Boolean).flatMap(a => [...txt(a.OtherInformation), ...txt(a.Deviation), ...txt(a.TrainComposition)]);   // Hinweise, die nicht interessieren
// nur Pendeltåg werden abgeblendet
const preferred = t => !/pendelt/i.test(txt(t.dep.ProductInformation).join(' '));
const prodName = a => { const p = txt(a.ProductInformation).join(' '); return /pendelt/i.test(p) ? 'SL' : p || 'Zug'; };

// Störungen, die diesen Zug wirklich betreffen: mind. ein Ort auf der eigenen Teilstrecke außerhalb von Stockholm C/City,
// oder Stockholm plus ein weiterer Ort auf dem Laufweg des Zuges
function trainMsgs(t) {
  const seg = t.stops && t.stops.length ? t.stops.map(s => s.sig) : [t.dep.LocationSignature, t.arr.LocationSignature];
  const runSigs = new Set(t.route || seg), segSet = new Set(seg);
  const tDep = new Date(realT(t.dep) || t.dep.AdvertisedTimeAtLocation), tArr = new Date(realT(t.arr) || t.arr.AdvertisedTimeAtLocation);
  return (state.extra.train || []).filter(m => {
    if (m.StartDateTime && new Date(m.StartDateTime) > tArr) return false;
    const end = m.PrognosticatedEndDateTimeTrafficImpact || m.EndDateTime;
    if (end && new Date(end) < tDep) return false;
    const locs = new Set();
    for (const ti of [].concat(m.TrafficImpact || [], m)) for (const l of [].concat(ti.AffectedLocation || [])) locs.add(l.LocationSignature || l);
    const onSeg = [...locs].filter(x => segSet.has(x));
    return onSeg.some(x => !isSthlm(x)) || (onSeg.length && [...locs].filter(x => runSigs.has(x)).length >= 2);
  });
}
// Bahnhofsmeldungen: Knivsta immer, Stockholm nur wenn sie die Strecke oder das eigene Gleis nennen
function stationMsgs(t) {
  const st = isSthlm(t.dep.LocationSignature) ? t.dep : t.arr;
  const re = new RegExp(`knivsta|uppsala|märsta|arlanda${st.TrackAtLocation ? `|spår ${st.TrackAtLocation}\\b` : ''}`, 'i');
  const now = Date.now(), seen = new Set();
  return (state.extra.station || []).filter(m => {
    if (m.StartDateTime && new Date(m.StartDateTime) > now + 3 * 3600e3) return false;
    if (m.EndDateTime && new Date(m.EndDateTime) < now) return false;
    if (m.LocationCode !== t.dep.LocationSignature && m.LocationCode !== t.arr.LocationSignature) return false;
    if (isSthlm(m.LocationCode) && !re.test(m.FreeText || '')) return false;
    if (!m.FreeText || seen.has(m.FreeText)) return false;
    seen.add(m.FreeText); return true;
  });
}

function card(t) {
  const {dep, arr} = t;
  const cx = dep.Canceled || arr.Canceled;
  const realDep = realT(dep) || dep.AdvertisedTimeAtLocation, realArr = realT(arr) || arr.AdvertisedTimeAtLocation;
  const dur = Math.round((new Date(realArr) - new Date(realDep)) / 60e3);
  const prod = prodName(dep);
  const tm = trainMsgs(t), sm = stationMsgs(t);
  const det = [];
  for (const m of tm) det.push(`<p><b>⚠️ ${esc(m.Header || txt(m.ReasonCode).join(', ') || 'Störung')}</b>${esc(m.ExternalDescription || '')}${m.PrognosticatedEndDateTimeTrafficImpact ? `<br>voraussichtlich bis ${hm(m.PrognosticatedEndDateTimeTrafficImpact)}` : ''}</p>`);
  for (const m of sm) det.push(`<p><b>ℹ️ ${esc(name(m.LocationCode))}</b>${esc(m.FreeText)}</p>`);
  for (const a of [dep, arr]) if (planned(a)) det.push(`<p><b>🚧 Geplante Fahrplanänderung</b>${esc(name(a.LocationSignature))}: ${hm(a.PlannedEstimatedTimeAtLocation)} statt ${hm(a.AdvertisedTimeAtLocation)}</p>`);
  if (prelim(dep) || prelim(arr)) det.push(`<p><b>≈ Prognose vorläufig</b>Die Zeit ist eine grobe Schätzung und kann sich noch deutlich ändern.</p>`);
  const infos = trainInfos([dep, arr, ...(t.stops || []).flatMap(x => [x.arr, x.dep])]);
  const long = infos.some(x => LONG.test(x)), short = !long && infos.some(x => SHORT.test(x));
  const icons = (tm.length ? '⚠️' : '') + (sm.length ? 'ℹ️' : '') + (planned(dep) || planned(arr) ? '🚧' : '');
  const devs = [...new Set([...txt(dep.Deviation), ...txt(arr.Deviation)])].filter(x => !NOISE.test(x));
  const st = isSthlm(dep.LocationSignature) ? dep : arr;              // nur das Stockholmer Gleis zeigen
  const pref = preferred(t);
  let html = `<div class="card${t === firstPref ? ' first' : ''}${pref ? '' : ' minor'}${cx ? ' cx' : ''}${state.open.has(t.id) ? ' open' : ''}" data-id="${esc(t.id)}">
    <div class="r1">${timeHtml(dep)}<span class="dur">→</span><span class="arr">${timeHtml(arr, 'x')}</span><span class="dur">${dur} min</span>
      <span class="trk"><small>${st.LocationSignature === 'Sci' ? 'City' : 'Sthlm'} Gl.</small>${esc(st.TrackAtLocation || '–')}</span></div>
    <div class="r2"><span class="in">${cx ? 'Fällt aus' : relIn(dep)}</span> · <b>${esc(prod)} ${esc(dep.AdvertisedTrainIdent)}</b>${long ? '<span class="tag">Långt tåg</span>' : short ? '<span class="tag short">Kort tåg</span>' : ''}${icons ? `<span class="ic">${icons}</span>` : ''}</div>`;
  if (devs.length) html += `<div class="dev">${devs.map(esc).join(' · ')}</div>`;
  if (t.last && t.last.LocationSignature !== dep.LocationSignature && new Date(t.last.TimeAtLocation) < new Date(dep.AdvertisedTimeAtLocation)) {
    const d = delayMin(t.last);
    html += `<div class="pos">${t.last.ActivityType === 'Ankomst' ? 'an' : 'ab'} ${esc(name(t.last.LocationSignature))} ${hm(t.last.TimeAtLocation)}${d ? ` (${d > 0 ? '+' : ''}${d})` : ''}</div>`;
  }
  if (det.length) html += `<div class="det">${det.join('')}</div>`;
  if (t.stops && t.stops.length) {
    html += `<ol class="stops">` + t.stops.map((s, k) => {
      const end = k === 0 || k === t.stops.length - 1;
      const done = (s.dep && s.dep.TimeAtLocation) || (s.arr && s.arr.TimeAtLocation);
      const tm = k === 0 ? stopTime(s.dep) : stopTime(s.arr || s.dep);
      return `<li class="${done ? 'done ' : ''}${end ? 'end' : ''}"><span class="n">${esc(name(s.sig))}</span><span class="tm">${tm}</span></li>`;
    }).join('') + `</ol>`;
  }
  return html + `</div>`;
}

state.extra = {train: [], station: [], wx: null, ts: 0, wxTs: 0, wxFor: ''};
async function postAlt(variants) {      // probiert Schema-Varianten der Reihe nach
  for (const v of variants) { try { return await post([v]); } catch (e) { if (e.status === 401) throw e; } }
  return null;
}
async function loadExtra(force) {
  const ex = state.extra, now = Date.now(), jobs = [];
  if (force || now - ex.ts > 120e3) {
    ex.ts = now;
    jobs.push(postAlt([
      `<QUERY objecttype="TrainMessage" schemaversion="1.7"><FILTER><EQ name="Deleted" value="false"/></FILTER></QUERY>`,
      `<QUERY objecttype="TrainMessage" schemaversion="1.7"><FILTER/></QUERY>`
    ]).then(r => { if (r) ex.train = (r[0].TrainMessage || []).filter(m => !m.Deleted); }));
    jobs.push(postAlt([
      `<QUERY objecttype="TrainStationMessage" schemaversion="1"><FILTER>${anyOf('LocationCode', ['Kn', 'Cst', 'Sci'])}</FILTER></QUERY>`
    ]).then(r => { if (r) ex.station = (r[0].TrainStationMessage || []).filter(m => !m.Deleted && m.Status !== 'Inaktiv'); }));
  }
  const at = route().from[0], ll = STATION_POS[at];
  if (ll && (force || ex.wxFor !== at || now - ex.wxTs > 600e3)) {
    ex.wxTs = now; ex.wxFor = at;
    const f = `<FILTER><WITHIN name="Geometry.WGS84" shape="center" value="${ll[1]} ${ll[0]}" radius="15000m"/></FILTER>`;
    jobs.push(postAlt([
      `<QUERY objecttype="WeatherMeasurepoint" schemaversion="2">${f}</QUERY>`,
      `<QUERY objecttype="WeatherMeasurepoint" namespace="Road.WeatherInfo" schemaversion="2.1">${f}</QUERY>`
    ]).then(r => { ex.wx = r ? nearestWx(r[0].WeatherMeasurepoint || [], ll) : null; }));
  }
  await Promise.all(jobs.map(j => j.catch(() => {})));
}
const val = o => o && typeof o === 'object' ? o.Value : o;
function nearestWx(pts, ll) {
  let best = null, bd = 1e9;
  for (const p of pts) {
    const m = /POINT\s*\(\s*([\d.]+)\s+([\d.]+)/.exec(p.Geometry && p.Geometry.WGS84 || ''), o = p.Observation;
    const temp = o && o.Air && val(o.Air.Temperature);
    if (!m || temp == null) continue;
    const d = km({lat: +m[2], lon: +m[1]}, {lat: ll[0], lon: ll[1]});
    if (d < bd) { bd = d; best = p; }
  }
  if (!best) return null;
  const o = best.Observation, agg = o.Aggregated10minutes || o.Aggregated30minutes || {};
  const pr = String((o.Weather && o.Weather.Precipitation) || '');
  const rain = val(agg.Precipitation && (agg.Precipitation.TotalWaterEquivalent || agg.Precipitation.RainSum));
  const snow = /snow|snö/i.test(pr) || (agg.Precipitation && agg.Precipitation.Snow);
  const wet = snow || /rain|regn|drizzle/i.test(pr) || (rain > 0);
  const wind = [].concat(o.Wind || []).map(w => val(w.Speed)).find(v => v != null);
  return {temp: Math.round(val(o.Air.Temperature)), icon: snow ? '❄️' : wet ? '🌧' : '', wind: wind != null ? Math.round(wind) : null, name: best.Name};
}

// Bahnstrecke grob: Knivsta – Arlanda C – Rosersberg – Upplands Väsby – Sollentuna – Solna – Stockholm C
const LINE = [[59.7258, 17.7866], [59.6497, 17.9289], [59.585, 17.885], [59.5186, 17.9116], [59.4283, 17.9484], [59.3654, 18.0102], [59.3307, 18.0586]];
function distToLine(p) {
  const kx = 111.32 * Math.cos(p.lat * Math.PI / 180), ky = 110.57;
  let best = 1e9;
  for (let i = 1; i < LINE.length; i++) {
    const ax = (LINE[i - 1][1] - p.lon) * kx, ay = (LINE[i - 1][0] - p.lat) * ky, bx = (LINE[i][1] - p.lon) * kx, by = (LINE[i][0] - p.lat) * ky;
    const dx = bx - ax, dy = by - ay, u = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / (dx * dx + dy * dy)));
    best = Math.min(best, Math.hypot(ax + u * dx, ay + u * dy));
  }
  return best;
}
const inCorridor = p => distToLine(p) < 3 && km(p, KNIVSTA) > 1.5 && km(p, STHLM) > 2.5;
const ENDS = ['Kn', 'Cst', 'Sci'];
state.travel = null;    // {ident, dest, stops, pos, others, cands}
const traveling = () => state.mode === 'auto' && state.travel && state.travel.dest;

// match=true: Zug suchen, dessen GPS-Position am nächsten an meinem Standort liegt
async function loadTravel(match) {
  const tv = state.travel;
  if (match || !tv.cands || Date.now() - tv.candTs > 300e3) {
    const res = await postTA(() => [queryXml('TrainAnnouncement', `<AND>${eq('ActivityType', 'Ankomst')}${eq('Advertised', 'true')}${anyOf('LocationSignature', ENDS)}<GT name="AdvertisedTimeAtLocation" value="$dateadd(-00:30:00)"/><LT name="AdvertisedTimeAtLocation" value="$dateadd(01:30:00)"/></AND>`)]);
    tv.cands = res[0].TrainAnnouncement || []; tv.candTs = Date.now();
  }
  const pos = await posQuery([...new Set(tv.cands.map(a => a.AdvertisedTrainIdent))], 5);
  if (match) {
    let best = null, bd = 2;
    for (const p of pos) { const d = km(p, state.here); if (d < bd) { bd = d; best = p; } }
    if (!best) return false;
    tv.ident = best.n;
  }
  const res = await postTA(() => [queryXml('TrainAnnouncement', `<AND>${eq('Advertised', 'true')}${eq('AdvertisedTrainIdent', tv.ident)}<GT name="AdvertisedTimeAtLocation" value="$dateadd(-04:00:00)"/><LT name="AdvertisedTimeAtLocation" value="$dateadd(03:00:00)"/></AND>`, 'orderby="AdvertisedTimeAtLocation"')]);
  const bySig = new Map();
  for (const a of res[0].TrainAnnouncement || []) {
    let x = bySig.get(a.LocationSignature);
    if (!x) bySig.set(a.LocationSignature, x = {sig: a.LocationSignature});
    x[a.ActivityType === 'Ankomst' ? 'arr' : 'dep'] = a;
  }
  const stops = [...bySig.values()].sort((x, y) => new Date((x.arr || x.dep).AdvertisedTimeAtLocation) - new Date((y.arr || y.dep).AdvertisedTimeAtLocation));
  const di = stops.findIndex(x => ENDS.includes(x.sig) && x.arr && !x.arr.TimeAtLocation);   // nächster noch nicht erreichter Endpunkt = Ziel
  if (di < 0) return false;
  const ni = stops.findIndex(x => !(x.arr && x.arr.TimeAtLocation) && !(x.dep && x.dep.TimeAtLocation));
  tv.stops = stops.slice(Math.max(0, ni), di + 1); tv.dest = stops[di]; tv.all = stops;
  tv.pos = pos.find(p => p.n === tv.ident) || null;
  // andere Züge zwischen mir und dem Ziel (Rechteck um beide, 1,5 km Rand)
  const me = tv.pos || state.here, ds = STATION_POS[tv.dest.sig];
  const la = [Math.min(me.lat, ds[0]) - 0.014, Math.max(me.lat, ds[0]) + 0.014], lo = [Math.min(me.lon, ds[1]) - 0.027, Math.max(me.lon, ds[1]) + 0.027];
  tv.others = pos.filter(p => p.n !== tv.ident && p.lat > la[0] && p.lat < la[1] && p.lon > lo[0] && p.lon < lo[1]);
  tv.ts = Date.now();
  return true;
}
function travelPanel() {
  const tv = state.travel, a = tv.dest.arr, any = tv.all.map(x => x.dep || x.arr).find(Boolean) || a;
  const infos = trainInfos(tv.all.flatMap(x => [x.arr, x.dep]));
  const long = infos.some(x => LONG.test(x)), short = !long && infos.some(x => SHORT.test(x));
  const devs = [...new Set(txt(a.Deviation))].filter(x => !NOISE.test(x));
  const next = tv.stops[0];
  const minor = /pendelt/i.test(txt(any.ProductInformation).join(' '));
  let h = `<div class="card travel open${minor ? ' minor' : ''}">
    <div class="r1">${timeHtml(a)}<span class="dur">an ${esc(name(tv.dest.sig))}</span>
      ${isSthlm(tv.dest.sig) ? `<span class="trk"><small>${tv.dest.sig === 'Sci' ? 'City' : 'Sthlm'} Gl.</small>${esc(a.TrackAtLocation || '–')}</span>` : ''}</div>
    <div class="r2"><span class="in">${relIn(a)}</span> · <b>${esc(prodName(any))} ${esc(tv.ident)}</b>${long ? '<span class="tag">Långt tåg</span>' : short ? '<span class="tag short">Kort tåg</span>' : ''}
      ${tv.pos && tv.pos.speed != null ? ` · <b>${tv.pos.speed} km/h</b>` : ''}${tv.pos ? ` · GPS ${hm(tv.pos.ts)}` : ''}</div>`;
  if (next && next !== tv.dest) h += `<div class="r2">nächster Halt <b>${esc(name(next.sig))}</b> ${stopTime(next.arr || next.dep)}</div>`;
  if (devs.length) h += `<div class="dev">${devs.map(esc).join(' · ')}</div>`;
  const late = delayMin(a);
  if (late >= 20) h += `<div class="comp">💰 <b>Försening ${late} min</b> – ersättning ${late >= 60 ? 100 : late >= 40 ? 75 : 50} % av snittpriset per resa</div>`;
  h += `<ol class="stops">` + tv.stops.map((x, k) => `<li class="${k === tv.stops.length - 1 ? 'end' : ''}"><span class="n">${esc(name(x.sig))}</span><span class="tm">${stopTime(x.arr || x.dep)}</span></li>`).join('') + `</ol>`;
  if (tv.others.length) h += `<div class="r2" style="margin-top:6px">${tv.others.length > 1 ? tv.others.length + ' weitere Züge' : '1 weiterer Zug'} zwischen dir und dem Ziel auf der Karte</div>`;
  return h + `</div>`;
}

const STATION_POS = {Kn: [59.7258, 17.7866], Cst: [59.3307, 18.0586], Sci: [59.3313, 18.0596]};

const loadPositions = data => posQuery([...new Set(data.trains.map(t => t.dep.AdvertisedTrainIdent))], 10);

  const res = await post([`<QUERY objecttype="TrainPosition" namespace="järnväg.trafikinfo" schemaversion="1.1"><FILTER><AND>${anyOf('Train.AdvertisedTrainNumber', nums)}<GT name="TimeStamp" value="$dateadd(-00:${String(maxAgeMin).padStart(2, '0')}:00)"/></AND></FILTER></QUERY>`]);

      day = dd.toDateString();
      const tomorrow = new Date(Date.now() + 864e5).toDateString() === day;
      html += `<div class="day">${tomorrow ? 'Morgen · ' : ''}${dd.toLocaleDateString('de-DE', {weekday: 'short', day: 'numeric', month: 'numeric'})}</div>`;
    }
    html += card(t);
  }
  if (!list.length && moreDone()) html = `<div class="msg">Keine Direktverbindung in den nächsten ${MAX_H} Stunden.</div>`;
  const m = state.more, h = Math.round((m.until - m.base) / 3600e3);
  html += moreDone() ? `<div class="day" id="end">Ende der Vorschau (${MAX_H} h)</div>`
    : `<div class="day" id="more">${m.loading ? 'lädt weitere Verbindungen…' : `bis +${h} h geladen · weiter scrollen`}</div>`;
  L.innerHTML = html;
  if (moreObs) { moreObs.disconnect(); const sen = $('#more'); if (sen) moreObs.observe(sen); }
}

// ---------- Nachladen beim Scrollen ----------
state.more = null;                            // {dir, base, until, trains, loading}
function resetMore() { state.more = {dir: dir(), base: Date.now(), until: Date.now() + FIRST_H * 3600e3, trains: [], loading: false}; }
function allTrains() {
  const live = state.data ? state.data.trains : [], ids = new Set(live.map(t => t.id));
  const liveEnd = live.length ? new Date(live[live.length - 1].dep.AdvertisedTimeAtLocation) : 0;
  const later = state.more && state.more.dir === dir() ? state.more.trains.filter(t => !ids.has(t.id) && new Date(t.dep.AdvertisedTimeAtLocation) > liveEnd) : [];
  return live.concat(later);
}
const moreDone = () => state.more && state.more.until >= state.more.base + MAX_H * 3600e3;
async function loadMore() {
  const m = state.more;
  if (!m || m.loading || moreDone() || m.dir !== dir() || !state.data || state.data.dir !== dir()) return;
  m.loading = true; render();
  const to = Math.min(m.until + PAGE_H * 3600e3, m.base + MAX_H * 3600e3);
  try {
    const r = await loadTrains(m.dir, m.until, to);
    if (state.more !== m) return;
    const ids = new Set(m.trains.map(t => t.id));
    m.trains.push(...r.trains.filter(t => !ids.has(t.id)));
    m.until = to;
  } catch (e) { state.error = 'Fehler beim Nachladen'; }
  m.loading = false; render();
  const sen = $('#more');                      // falls der Platzhalter noch sichtbar ist, gleich weiter
  if (sen && sen.getBoundingClientRect().top < innerHeight + 300) loadMore();
}
const moreObs = 'IntersectionObserver' in window ? new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) loadMore(); }, {rootMargin: '300px'}) : null;

// ---------- Ablauf ----------
let seq = 0;
async function refresh() {
  if (!state.key) return render();
  if (traveling()) return refreshTravel();
  const my = ++seq, d = dir();
  state.busy = true; render();
  try {
    const data = await loadTrains(d);
    if (my !== seq) return;
    const prev = state.data && state.data.dir === d ? state.data : null;
    const known = prev ? prev.trains.concat(state.more && state.more.dir === d ? state.more.trains : []) : [];
    for (const t of data.trains) { const o = known.find(x => x.id === t.id); if (o) { t.stops = o.stops; t.last = o.last; t.route = o.route; t.origin = o.origin; } }
    state.data = data; state.error = ''; render();
    await Promise.all([loadStops({trains: data.trains.slice(0, 12)}).catch(() => {}), loadNames(), drawMap(), loadExtra()]);
    if (my !== seq) return;
    ls.set('cache_' + d, data);
  } catch (e) {
    if (my !== seq) return;
    state.error = e.status === 401 || /auth/i.test(e.message) ? 'API-Schlüssel ungültig' : navigator.onLine === false ? 'offline' : 'Fehler: ' + e.message;
  }
  state.busy = false; render();
}

async function refreshTravel() {
  let ok = false;
  try { ok = await loadTravel(false); } catch {}
  if (!traveling()) return;
  if (!ok) { state.travel = null; state.userPanned = false; locate(); return; }   // angekommen oder Zug verloren
  render(); drawMap();
}
function km(a, b) {
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
function noLocation(why) {
  const nd = timeDir(), changed = nd !== state.autoDir;
  state.locText = `🕒 nach Uhrzeit (${why})`;
  state.autoDir = nd;
  if (state.mode === 'auto' && changed) { state.userPanned = false; state.extra.wxFor = ''; useCache(); refresh(); } else render();
}
// Standort in zwei Stufen: erst schnell (darf bis 2 min alt sein), dann eine frische, genaue Messung nachschieben
let lastFix = 0;
async function handlePos(p) {
  if (p.timestamp < lastFix) return;                 // ältere Messung kam später an
  lastFix = p.timestamp;
  const here = state.here = {lat: p.coords.latitude, lon: p.coords.longitude};
  const corridor = state.mode === 'auto' && state.key && inCorridor(here);
  if (corridor && traveling()) return;               // schon im Unterwegs-Modus
  const wasTravel = !!traveling();
  state.travel = null;
  if (corridor) {
    state.travel = {};
    let ok = false;
    try { ok = await loadTravel(true); } catch {}
    if (ok && state.mode === 'auto') { state.locText = '🚆 unterwegs'; state.userPanned = false; render(); drawMap(); return; }
    state.travel = null;
  }
  const dk = km(here, KNIVSTA), ds = km(here, STHLM);
  const nd = dk <= KNIVSTA_RADIUS_KM || dk < ds ? 'toSt' : 'toKn';
  state.locText = nd === 'toSt' ? '📍 Knivsta' : '📍 Sthlm';
  const changed = nd !== state.autoDir || wasTravel;
  state.autoDir = nd; ls.set('autoDir', nd); ls.set('autoDirTs', Date.now());
  if (state.mode === 'auto' && changed) { state.userPanned = false; state.extra.wxFor = ''; useCache(); refresh(); } else render();
}
function refineLocation() {
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(handlePos, () => {}, {enableHighAccuracy: true, maximumAge: 0, timeout: 20000});
}
function locate() {
  if (!navigator.geolocation) return noLocation('kein GPS');
  state.locText = '📍 …'; render();
  navigator.geolocation.getCurrentPosition(handlePos, () => noLocation('kein Standort'),
    {enableHighAccuracy: false, maximumAge: 120e3, timeout: 5000});
  refineLocation();
}
// ---------- Radio (Sveriges Radio live) ----------
const SR = {p1: 132, p2: 163, p3: 164, p4: () => state.autoDir === 'toSt' ? 213 : 701};   // P4 Uppland bzw. P4 Stockholm
const SR_NAMES = {p1: 'Sveriges Radio P1', p2: 'Sveriges Radio P2', p3: 'Sveriges Radio P3', p4: 'Sveriges Radio P4', flux: 'FluxFM'};
const FLUX = ['https://streams.fluxfm.de/live/mp3-320/audio/', 'https://streams.fluxfm.de/live/mp3-128/audio/', 'https://streams.fluxfm.de/live/aac-64/audio/'];
const radio = {audio: null, ch: null};
function radioUrls(ch) {
  if (ch === 'flux') return FLUX;
  const id = typeof SR[ch] === 'function' ? SR[ch]() : SR[ch];
  return [`https://sverigesradio.se/topsy/direkt/srapi/${id}.mp3`, `https://sverigesradio.se/topsy/direktsand/${id}.mp3`];
}
function radioUi(wait) {
  document.querySelectorAll('#radio button').forEach(b => {
    b.classList.toggle('on', b.dataset.ch === radio.ch && !wait);
    b.classList.toggle('wait', b.dataset.ch === radio.ch && !!wait);
  });
}
// Handelsblatt Morning Briefing: neueste Folge aus dem Podcast-Feed, Hörposition wird gemerkt
const HB_FEED = 'https://handelsblatt-morningbriefing.podigee.io/feed/mp3';
async function hbLatest() {
  let xml = null;
  for (const u of [HB_FEED, 'https://api.allorigins.win/raw?url=' + encodeURIComponent(HB_FEED)]) {
    try { const r = await fetch(u); if (r.ok) { xml = await r.text(); break; } } catch {}
  }
  if (!xml) throw new Error('Feed nicht erreichbar');
  const item = new DOMParser().parseFromString(xml, 'text/xml').querySelector('item');
  const enc = item && item.querySelector('enclosure');
  if (!enc) throw new Error('keine Folge gefunden');
  return {url: enc.getAttribute('url'), title: (item.querySelector('title') || {}).textContent || 'Morning Briefing'};
}
function radioStop() {
  const a = radio.audio;
  if (a) { if (radio.ep) ls.set('hbPos', {url: radio.ep.url, t: a.currentTime}); a.pause(); a.removeAttribute('src'); a.load(); }
  radio.ep = null;
}
async function radioPlay(ch) {
  const wasSame = radio.ch === ch;
  radioStop();
  if (wasSame) { radio.ch = null; return radioUi(); }             // gleicher Knopf = Stopp
  radio.ch = ch;
  const a = radio.audio || (radio.audio = new Audio());
  let urls;
  if (ch === 'hb') {
    radioUi(true);
    try { radio.ep = await hbLatest(); } catch { if (radio.ch === 'hb') { radio.ch = null; radioUi(); } return; }
    if (radio.ch !== 'hb') return;
    urls = [radio.ep.url];
    const pos = ls.get('hbPos', null);
    const HB_SKIP = 90;                                            // Intro/Werbung überspringen
    a.onloadedmetadata = () => {
      const saved = radio.ep && pos && pos.url === radio.ep.url ? pos.t - 3 : 0;
      a.currentTime = Math.max(HB_SKIP, saved); a.onloadedmetadata = null;
    };
    a.onpause = () => { if (radio.ep) ls.set('hbPos', {url: radio.ep.url, t: a.currentTime}); };
  } else { urls = radioUrls(ch); a.onloadedmetadata = null; a.onpause = null; }
  let k = 0;
  a.onerror = () => { if (radio.ch === ch && ++k < urls.length) { a.src = urls[k]; a.play().catch(() => {}); } else if (radio.ch === ch) { radio.ch = null; radioUi(); } };
  a.onplaying = () => radioUi();
  a.onended = () => { if (radio.ch === 'hb') { ls.set('hbPos', null); radio.ep = null; radio.ch = null; radioUi(); } };
  a.src = urls[0];
  radioUi(true);
  a.play().catch(() => {});
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata(ch === 'hb' ? {title: radio.ep.title, artist: 'Handelsblatt Morning Briefing'} : {title: SR_NAMES[ch], artist: 'Live'});
}
$('#radio').addEventListener('click', e => { const b = e.target.closest('button'); if (b) radioPlay(b.dataset.ch); });

function useCache() {
  const c = ls.get('cache_' + dir(), null);
  if (c && Date.now() - c.ts < 15 * 60e3) state.data = c;
}

document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.mode = b.dataset.d; ls.set('mode', state.mode); state.userPanned = false; state.extra.wxFor = ''; state.travel = null;
  if (state.mode === 'auto') locate();
  useCache(); render(); refresh();
});
$('#btnSettings').onclick = () => $('#settings').classList.toggle('open');
$('#key').value = state.key; $('#ckey').value = state.ckey; $('#mapstyle').value = state.mapstyle; $('#city').checked = state.city;
$('#btnSave').onclick = () => {
  state.key = $('#key').value.trim(); state.city = $('#city').checked;
  ls.set('key', state.key); ls.set('city', state.city);
  const ck = $('#ckey').value.trim();
  const ms = $('#mapstyle').value;
  if (ck !== state.ckey || ms !== state.mapstyle) { state.ckey = ck; state.mapstyle = ms; ls.set('ckey', ck); ls.set('mapstyle', ms); setTiles(); }
  $('#settings').classList.remove('open'); state.data = null; state.error = ''; refresh();
};
$('#list').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  const id = c.dataset.id;
  state.open.has(id) ? state.open.delete(id) : state.open.add(id);
  c.classList.toggle('open');
  const t = allTrains().find(x => x.id === id);
  if (t && !t.stops && state.open.has(id)) loadStops({trains: [t]}).then(render).catch(() => {});
});

document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (state.more && Date.now() - state.more.base > 30 * 60e3) state.more = null; if (state.mode === 'auto') locate(); refresh(); } });
setInterval(() => { if (!document.hidden) refresh(); }, 30e3);
setInterval(() => { if (!document.hidden && state.mode === 'auto') refineLocation(); }, 120e3);   // unterwegs einsteigen erkennen
setInterval(() => { if (!document.hidden && !state.busy) render(); }, 15e3);

useCache(); render(); refresh();
if (state.mode === 'auto') locate();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
